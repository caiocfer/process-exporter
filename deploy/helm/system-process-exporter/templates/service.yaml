apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-system-process-exporter
  labels:
    app.kubernetes.io/name: system-process-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: system-process-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
