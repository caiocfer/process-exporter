name: Helm Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  helm-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure git identity
        run: |
          git config user.name "${{ secrets.GITHUB_USERNAME }}"
          git config user.email "${{ secrets.GITHUB_USERNAME }}@users.noreply.github.com"

      - name: Create chart releases
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: deploy/helm
          config: .cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and publish chart to gh-pages
        if: always()
        run: |
          set -euo pipefail
          URL="https://caiocfer.github.io/process-exporter"
          PKG_DIR=.cr-release-packages
          
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          
          helm package deploy/helm/system-process-exporter --destination "$PKG_DIR"
          
          if [ -f index.yaml ]; then
            helm repo index "$PKG_DIR" --url "$URL" --merge index.yaml
          else
            helm repo index "$PKG_DIR" --url "$URL"
            mv "$PKG_DIR/index.yaml" index.yaml
          fi
          
          cp "$PKG_DIR"/*.tgz .
          git add index.yaml *.tgz
          git commit -m "Add system-process-exporter chart" || true
          git push origin gh-pages
