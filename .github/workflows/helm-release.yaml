name: Helm Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  helm-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure git identity
        run: |
          git config user.name "${{ secrets.GITHUB_USERNAME }}"
          git config user.email "${{ secrets.GITHUB_USERNAME }}@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: deploy/helm
          config: .cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Verify gh-pages release
        run: |
          echo "Confirming chart index and packages were published to the gh-pages branch."
          git ls-remote --heads origin gh-pages
          git fetch --depth=1 origin gh-pages
          if git cat-file -e origin/gh-pages:index.html 2>/dev/null; then
            echo "gh-pages contains index.html and packages."
          else
            echo "gh-pages branch does not yet contain the chart index; chart-releaser (release_branch: gh-pages, skip_existing: true) publishes it on completion."
          fi
